name: Pakete bauen

# Bei einem Tag wie v1.0.0 entstehen alle Pakete und werden an ein Release gehaengt.
# Ueber "Run workflow" laesst sich der Lauf auch ohne Tag anstossen; die Dateien
# haengen dann als Artefakte am Lauf.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Release anlegen
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Anlegen, falls noch nicht vorhanden
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME gibt es schon."
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "Bar Display $GITHUB_REF_NAME" \
              --notes "Pakete für Windows und Linux. Installationshinweise stehen in der README."
          fi

  linux:
    name: Linux (AppImage, deb, tar.gz)
    needs: [release]
    if: always() && (needs.release.result == 'success' || needs.release.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhaengigkeiten
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1

      - name: ffmpeg holen
        run: npm run vendor:ffmpeg

      - name: Umgebung
        shell: bash
        run: |
          echo "node   $(node --version)"
          echo "npm    $(npm --version)"
          echo "builder $(npx electron-builder --version)"
          ls -la vendor/ffmpeg/*/ || true

      - name: Tests
        run: npm test

      - name: Bauen
        run: npx electron-builder --linux AppImage deb tar.gz --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.tar.gz

      - name: An das Release haengen
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/*.AppImage dist/*.deb dist/*.tar.gz --clobber

  windows:
    name: Windows (Installer, portable)
    needs: [release]
    if: always() && (needs.release.result == 'success' || needs.release.result == 'skipped')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhaengigkeiten
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1

      - name: ffmpeg holen
        run: npm run vendor:ffmpeg

      - name: Umgebung
        shell: bash
        run: |
          echo "node   $(node --version)"
          echo "npm    $(npm --version)"
          echo "builder $(npx electron-builder --version)"
          ls -la vendor/ffmpeg/*/ || true

      - name: Tests
        run: npm test

      - name: Bauen
        run: npx electron-builder --win nsis portable --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.exe

      - name: An das Release haengen
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/*.exe --clobber
